name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: heself/vibeapi

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            heself/vibeapi:${{ env.TAG }}-${{ matrix.arch }}
            heself/vibeapi:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Get GitHub OIDC token
        shell: bash
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub did not provide OIDC credentials. Ensure this job has 'id-token: write' permission."
            exit 1
          fi

          oidc_response="$(mktemp)"
          trap 'rm -f "$oidc_response"' EXIT

          for attempt in 1 2 3; do
            http_status="$(
              curl --silent --show-error \
                --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                --output "$oidc_response" \
                --write-out '%{http_code}' \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore"
            )" || http_status="request-error"

            if [[ "$http_status" == "200" ]] && OIDC_TOKEN="$(jq --raw-output --exit-status '.value | select(type == "string" and length > 0)' "$oidc_response" 2>/dev/null)"; then
              echo "::add-mask::${OIDC_TOKEN}"
              echo "OIDC_TOKEN=${OIDC_TOKEN}" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "OIDC token request failed (attempt ${attempt}/3, HTTP ${http_status:-unknown})." >&2
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 2))"
            fi
          done

          echo "::error::Unable to retrieve a valid GitHub OIDC token after 3 attempts. Check the job's effective 'id-token: write' permission and GitHub Actions OIDC availability."
          exit 1

      - name: Sign image with cosign
        run: cosign sign --yes --identity-token "${OIDC_TOKEN}" heself/vibeapi@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "heself/vibeapi:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write

    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t heself/vibeapi:${TAG} \
            heself/vibeapi:${TAG}-amd64 \
            heself/vibeapi:${TAG}-arm64

      - name: Create & push manifest (latest)
        run: |
          docker buildx imagetools create \
            -t heself/vibeapi:latest \
            heself/vibeapi:latest-amd64 \
            heself/vibeapi:latest-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Get GitHub OIDC token
        shell: bash
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub did not provide OIDC credentials. Ensure this job has 'id-token: write' permission."
            exit 1
          fi

          oidc_response="$(mktemp)"
          trap 'rm -f "$oidc_response"' EXIT

          for attempt in 1 2 3; do
            http_status="$(
              curl --silent --show-error \
                --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                --output "$oidc_response" \
                --write-out '%{http_code}' \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore"
            )" || http_status="request-error"

            if [[ "$http_status" == "200" ]] && OIDC_TOKEN="$(jq --raw-output --exit-status '.value | select(type == "string" and length > 0)' "$oidc_response" 2>/dev/null)"; then
              echo "::add-mask::${OIDC_TOKEN}"
              echo "OIDC_TOKEN=${OIDC_TOKEN}" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "OIDC token request failed (attempt ${attempt}/3, HTTP ${http_status:-unknown})." >&2
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 2))"
            fi
          done

          echo "::error::Unable to retrieve a valid GitHub OIDC token after 3 attempts. Check the job's effective 'id-token: write' permission and GitHub Actions OIDC availability."
          exit 1

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes --identity-token "${OIDC_TOKEN}" heself/vibeapi:${TAG}
          cosign sign --yes --identity-token "${OIDC_TOKEN}" heself/vibeapi:latest

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect heself/vibeapi:${TAG} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
